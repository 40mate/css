<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>광산 진행도 바 연출 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
:root {
  --text-primary: #1a1a17;
  --text-secondary: #5f5e5a;
  --border: #d9d7ce;
  --surface: #faf9f5;
}
@media (prefers-color-scheme: dark) {
  :root { --text-primary: #f0efea; --text-secondary: #b4b2a9; --border: #46453f; --surface: #262624; }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 40px 20px;
  background: var(--surface);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif;
}
.wrap { max-width: 640px; margin: 0 auto; }
button {
  font: inherit;
  font-size: 14px;
  color: var(--text-primary);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 16px;
  cursor: pointer;
}
button:hover { background: rgba(128,128,128,0.08); }
button:active { transform: scale(0.98); }
input[type=range] { accent-color: #378add; }
label { user-select: none; }
@keyframes flow { from { background-position: 0 0; } to { background-position: 36px 0; } }
@keyframes edgepulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
</style>
</head>
<body>
<div class="wrap">

<div id="panel" style="background:#232f4b;border-radius:16px;padding:28px 32px 32px;">
  <div style="text-align:center;font-size:18px;font-weight:600;color:#fff;margin-bottom:14px;text-shadow:0 2px 0 rgba(0,0,0,0.45);">Mine progress</div>
  <div id="barwrap" style="position:relative;">
    <div id="bar" style="position:relative;height:38px;background:#3d3629;border:4px solid #151d33;border-radius:12px;">
      <div id="fillclip" style="position:absolute;inset:2px;border-radius:7px;overflow:hidden;">
        <div id="fill" style="position:absolute;left:0;top:0;bottom:0;width:35%;background:#38a8f8;border-radius:7px 3px 3px 7px;">
          <div id="flow" style="position:absolute;inset:0;background:repeating-linear-gradient(-60deg,rgba(255,255,255,0.06) 0 12px,rgba(255,255,255,0) 12px 36px);background-size:36px 100%;animation:flow 1.8s linear infinite;"></div>
          <div style="position:absolute;left:0;right:0;top:0;height:34%;background:rgba(255,255,255,0.28);border-radius:7px 3px 0 0;"></div>
          <div id="flash" style="position:absolute;inset:0;background:#fff;opacity:0;"></div>
        </div>
      </div>
      <div id="goal" style="position:absolute;top:-4px;bottom:-4px;left:80%;width:7px;margin-left:-3.5px;background:#ffffff;border:2px solid #151d33;border-radius:3px;"></div>
      <div id="edge" style="position:absolute;top:-9px;bottom:-9px;left:35%;width:8px;margin-left:-4px;background:#eaf6ff;border:2px solid #151d33;border-radius:4px;animation:edgepulse 1.6s ease-in-out infinite;"></div>
      <div id="pct" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#fff;text-shadow:-1px -1px 0 #1b2440,1px -1px 0 #1b2440,-1px 1px 0 #1b2440,1px 1px 0 #1b2440,0 2px 0 #1b2440;">35%</div>
    </div>
  </div>
</div>

<div style="display:flex;gap:8px;justify-content:center;margin:20px 0 0;flex-wrap:wrap;">
  <button id="btnMine"><i class="ti ti-pick"></i> 채굴</button>
  <button id="btnAuto"><i class="ti ti-player-play"></i> 자동 채굴</button>
  <button id="btnReset"><i class="ti ti-refresh"></i> 리셋</button>
</div>

<div style="display:flex;gap:16px;justify-content:center;margin:16px 0 0;flex-wrap:wrap;font-size:13px;color:var(--text-secondary);">
  <label style="display:flex;gap:5px;align-items:center;"><input type="checkbox" id="fxEdge" checked> 엣지 바 펀치</label>
  <label style="display:flex;gap:5px;align-items:center;"><input type="checkbox" id="fxSpark" checked> 스파크</label>
  <label style="display:flex;gap:5px;align-items:center;"><input type="checkbox" id="fxFlash" checked> 필 플래시</label>
  <label style="display:flex;gap:5px;align-items:center;"><input type="checkbox" id="fxFlow" checked> 필 흐름</label>
  <label style="display:flex;gap:5px;align-items:center;"><input type="checkbox" id="fxText" checked> 텍스트 펀치</label>
</div>

<div style="display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;max-width:420px;margin:16px auto 0;font-size:13px;color:var(--text-secondary);">
  <span>차오르는 시간</span><input type="range" id="cfgDur" min="100" max="900" step="50" value="350"><span id="cfgDurOut" style="min-width:48px;text-align:right;">350ms</span>
  <span>스파크 개수</span><input type="range" id="cfgSpark" min="0" max="14" step="1" value="6"><span id="cfgSparkOut" style="min-width:48px;text-align:right;">6</span>
  <span>채굴량</span><input type="range" id="cfgGain" min="1" max="15" step="1" value="5"><span id="cfgGainOut" style="min-width:48px;text-align:right;">5%</span>
  <span>흐름 강도</span><input type="range" id="cfgFlowA" min="0" max="0.2" step="0.01" value="0.06"><span id="cfgFlowAOut" style="min-width:48px;text-align:right;">0.06</span>
  <span>흐름 속도</span><input type="range" id="cfgFlow" min="0.5" max="4" step="0.1" value="1.8"><span id="cfgFlowOut" style="min-width:48px;text-align:right;">1.8s</span>
</div>

</div>
<script>
const $ = id => document.getElementById(id);
const fill = $('fill'), edge = $('edge'), pct = $('pct'), flash = $('flash'), flow = $('flow');
const bar = $('bar'), barwrap = $('barwrap');
let value = 35, tweenRaf = null, autoTimer = null;

function render(v){
  fill.style.width = v + '%';
  edge.style.left = v + '%';
  pct.textContent = Math.round(v) + '%';
}

function tweenTo(target, dur){
  if (tweenRaf) cancelAnimationFrame(tweenRaf);
  const from = value, start = performance.now();
  function step(now){
    let t = Math.min(1, (now - start) / dur);
    t = 1 - (1 - t) * (1 - t);
    value = from + (target - from) * t;
    render(value);
    if (t < 1) tweenRaf = requestAnimationFrame(step);
    else { value = target; tweenRaf = null; }
  }
  tweenRaf = requestAnimationFrame(step);
}

function playFx(){
  if ($('fxEdge').checked){
    edge.animate([
      {transform:'scale(1)'},{transform:'scale(1.6,1.35)',offset:0.3},
      {transform:'scale(0.9)',offset:0.6},{transform:'scale(1)'}
    ],{duration:300,easing:'ease-out'});
  }
  if ($('fxText').checked){
    pct.animate([
      {transform:'scale(1)'},{transform:'scale(1.22)',offset:0.35},{transform:'scale(1)'}
    ],{duration:250,easing:'ease-out'});
  }
  if ($('fxFlash').checked){
    flash.animate([{opacity:0.55},{opacity:0}],{duration:300,easing:'ease-out'});
  }
  if ($('fxSpark').checked) sparkBurst(+$('cfgSpark').value);
}

function sparkBurst(n){
  const w = bar.clientWidth;
  const x = value / 100 * w, y = bar.clientHeight / 2;
  for (let i = 0; i < n; i++){
    const s = document.createElement('div');
    const size = 4 + Math.random() * 5;
    s.style.cssText = 'position:absolute;pointer-events:none;width:'+size+'px;height:'+size+'px;border-radius:2px;background:'+(Math.random()<0.5?'#fff':'#9ed6fb')+';left:'+x+'px;top:'+y+'px;';
    barwrap.appendChild(s);
    const ang = (20 + Math.random() * 140) * Math.PI / 180;
    const dist = 22 + Math.random() * 34;
    const dx = Math.cos(ang) * dist, dy = -Math.sin(ang) * dist;
    s.animate([
      {transform:'translate(-50%,-50%) rotate(0deg) scale(1)',opacity:1},
      {transform:'translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px)) rotate('+(Math.random()*180-90)+'deg) scale(0.2)',opacity:0}
    ],{duration:420 + Math.random() * 150,easing:'cubic-bezier(0.2,0.7,0.4,1)'}).onfinish = () => s.remove();
  }
}

function mine(){
  if (value >= 100){ value = 0; render(0); return; }
  const gain = +$('cfgGain').value * (0.7 + Math.random() * 0.6);
  tweenTo(Math.min(100, value + gain), +$('cfgDur').value);
  playFx();
}

$('btnMine').onclick = mine;
$('btnReset').onclick = () => { if (tweenRaf) cancelAnimationFrame(tweenRaf); tweenRaf = null; value = 0; render(0); };
$('btnAuto').onclick = function(){
  if (autoTimer){ clearInterval(autoTimer); autoTimer = null; this.innerHTML = '<i class="ti ti-player-play"></i> 자동 채굴'; }
  else { autoTimer = setInterval(mine, 650); this.innerHTML = '<i class="ti ti-player-pause"></i> 정지'; }
};
$('fxFlow').onchange = e => flow.style.display = e.target.checked ? '' : 'none';
$('cfgDur').oninput = e => $('cfgDurOut').textContent = e.target.value + 'ms';
$('cfgSpark').oninput = e => $('cfgSparkOut').textContent = e.target.value;
$('cfgGain').oninput = e => $('cfgGainOut').textContent = e.target.value + '%';
$('cfgFlowA').oninput = e => {
  const a = +e.target.value;
  $('cfgFlowAOut').textContent = a.toFixed(2);
  flow.style.background = 'repeating-linear-gradient(-60deg,rgba(255,255,255,'+a+') 0 12px,rgba(255,255,255,0) 12px 36px)';
  flow.style.backgroundSize = '36px 100%';
};
$('cfgFlow').oninput = e => { $('cfgFlowOut').textContent = e.target.value + 's'; flow.style.animationDuration = e.target.value + 's'; };
render(value);
</script>
</body>
</html>
